# 自动打包：Mac 通用版（Intel + Apple 芯片）和 Windows 安装包，并附到对应的 GitHub 发布页。
# 触发方式：
#   1. 推送 v 开头的标签（如 git tag v6702 && git push origin v6702）
#   2. 在仓库 Actions 页面手动运行，填入已有的发布标签（如 v6701）
name: 打包发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加安装包的发布标签，如 v6701"
        required: true
        default: "v6701"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Mac 通用版需要同时编译两种芯片
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG }}
          releaseDraft: false
          args: ${{ matrix.args }}
          # GitHub 附件名不支持中文，用英文名
          releaseAssetNamePattern: proxy-routing_${{ env.TAG }}_[arch][setup][ext]
